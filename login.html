<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Gestia</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f1e9;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 420px;
            background: #fffdf9;
            padding: 45px;
            border-radius: 22px;

            box-shadow:
                0 15px 45px rgba(70, 60, 50, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #6f6254;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #77716a;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #4d4741;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd5cb;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #8c7761;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 11px;

            background: #8c7761;
            color: white;

            font-size: 16px;
            cursor: pointer;

            margin-top: 10px;
        }

        .login-button:hover {
            background: #756352;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: 12px;

            color: #8c7761;
            text-decoration: none;
            font-size: 13px;
        }

        .register {
            text-align: center;
            margin-top: 30px;
            color: #77716a;
            font-size: 14px;
        }

        .register a {
            color: #8c7761;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;

            color: #77716a;
            text-decoration: none;
            font-size: 14px;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="logo">
            gestia
        </div>

        <div class="subtitle">
            Gestiona tu negocio de forma sencilla
        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="tu@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Tu contraseña"
                    required
                >

            </div>


            <a href="#" class="forgot">
                ¿Has olvidado tu contraseña?
            </a>


            <button
                type="submit"
                class="login-button">

                Iniciar sesión

            </button>

        


        <div class="register">

            ¿Todavía no tienes una cuenta?

            <a href="registro.html">
                Crear cuenta
            </a>

        </div>


        <a href="index.html" class="back">
            ← Volver a Gestia
        </a>

    </div>
    
<script src="app.js"></script>
<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const usuarioGuardado = localStorage.getItem("usuario");

    if (!usuarioGuardado) {
        alert("No existe ninguna cuenta registrada.");
        return;
    }

    const usuario = JSON.parse(usuarioGuardado);

    if (email === usuario.email && password === usuario.password) {

        localStorage.setItem("sesionIniciada", "true");

        alert("Inicio de sesión correcto.");

        window.location.href = "dashboard.html";

    } else {

        alert("El correo electrónico o la contraseña no son correctos.");

    }

});

</script>
</body>

</html>
